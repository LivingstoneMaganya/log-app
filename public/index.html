<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple daily log for tracking developer work, fixes, features, and learning." />
    <meta name="theme-color" content="#202320" />
    <title>Daily Log | Track Your Work</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="container">
      <div class="ambient-glow ambient-glow-one"></div>
      <div class="ambient-glow ambient-glow-two"></div>

      <div id="authSection" class="auth-view">
        <section class="auth-panel">
          <h2 id="authTitle">Login</h2>
          <p class="panel-subtitle">Your work, in one place.</p>
          <div id="authError" class="error-msg" role="alert"></div>

          <form id="authForm">
            <div class="input-group">
              <label for="authUsername">Username</label>
              <input type="text" id="authUsername" placeholder="your username" autocomplete="username" required />
            </div>

            <div class="input-group">
              <label for="authPassword">Password</label>
              <input type="password" id="authPassword" placeholder="••••••••" autocomplete="current-password" required />
            </div>

            <button type="submit" id="authSubmitBtn" class="primary-btn">Log In <span class="button-arrow">↗</span></button>
          </form>

          <p class="toggle-text">
            <span id="toggleMsg">Don't have an account?</span>
            <a href="#" id="toggleAuthMode">Register here</a>
          </p>
        </section>
      </div>

      <div id="appSection" class="hidden">
        <div class="header-bar">
          <div class="dashboard-brand">
            <div class="brand-mark small">DL</div>
            <div>
              <p class="eyebrow">Workspace</p>
              <h1>Daily Log</h1>
            </div>
          </div>
          <div class="account-actions">
            <div class="user-chip"><span class="avatar-dot"></span><span id="userDisplay"></span></div>
            <button id="logoutBtn" class="secondary-btn">Log out <span>↗</span></button>
          </div>
        </div>

        <div class="dashboard-intro">
          <div>
            <p class="eyebrow">Today</p>
            <h2>What did you work on?</h2>
          </div>
          <div class="date-stamp">Live log <span class="pulse-dot"></span></div>
        </div>

        <div class="workspace-grid">
          <section class="editor-panel">
              <div class="section-heading">
              <div>
                <span class="section-number">01</span>
                <h2>New entry</h2>
              </div>
              <span class="writing-mark">✦</span>
            </div>

            <form id="logForm">
              <input type="hidden" id="logId" />

              <div class="input-group">
                <label for="title">Title</label>
                <input type="text" id="title" placeholder="e.g. Optimized Neon pool queries" required />
              </div>

              <div class="input-group">
                <label for="category">Category</label>
                <select id="category">
                  <option value="Feature">Feature</option>
                  <option value="Bug Fix">Bug Fix</option>
                  <option value="Refactor">Refactor</option>
                  <option value="Learning">Learning</option>
                </select>
              </div>

              <div class="input-group">
                <label for="content">Details</label>
                <textarea id="content" rows="5" placeholder="What did you build or fix?" required></textarea>
              </div>

              <button type="submit" id="saveLogBtn" class="primary-btn">Save Log <span class="button-arrow">↗</span></button>
            </form>
          </section>

          <section class="logs-panel">
            <div class="section-heading">
              <div>
                <span class="section-number">02</span>
                <h2>Recent entries</h2>
              </div>
              <span class="log-count">Live</span>
            </div>
            <div id="logsList"></div>
          </section>
        </div>

      </div>
    </main>
  </body>
</html>
