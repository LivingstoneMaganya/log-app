<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Developer Daily Log</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="container">
      <!-- AUTHENTICATION VIEW -->
      <div id="authSection">
        <h1 id="authTitle">Login</h1>
        <div id="authError" class="error-msg"></div>

        <form id="authForm">
          <div class="input-group">
            <label for="authUsername">Username</label>
            <input type="text" id="authUsername" required />
          </div>

          <div class="input-group">
            <label for="authPassword">Password</label>
            <input type="password" id="authPassword" required />
          </div>

          <button type="submit" id="authSubmitBtn">Log In</button>
        </form>

        <p class="toggle-text">
          <span id="toggleMsg">Don't have an account?</span>
          <a href="#" id="toggleAuthMode">Register here</a>
        </p>
      </div>

      <!-- APP DASHBOARD VIEW (Hidden by default) -->
      <div id="appSection" class="hidden">
        <div class="header-bar">
          <h2>Welcome, <span id="userDisplay"></span>!</h2>
          <button id="logoutBtn" class="secondary-btn">Logout</button>
        </div>

        <form id="logForm">
          <input type="hidden" id="logId" />

          <div class="input-group">
            <label for="title">Title</label>
            <input
              type="text"
              id="title"
              placeholder="e.g. Optimized Neon pool queries"
              required
            />
          </div>

          <div class="input-group">
            <label for="category">Category</label>
            <select id="category">
              <option value="Feature">Feature</option>
              <option value="Bug Fix">Bug Fix</option>
              <option value="Refactor">Refactor</option>
              <option value="Learning">Learning</option>
            </select>
          </div>

          <div class="input-group">
            <label for="content">Details</label>
            <textarea
              id="content"
              rows="3"
              placeholder="What did you build or fix?"
              required
            ></textarea>
          </div>

          <button type="submit" id="saveLogBtn">Save Log</button>
        </form>

        <hr />

        <h2>Your Daily Logs</h2>
        <div id="logsList"></div>
      </div>
    </div>
  </body>
</html>
